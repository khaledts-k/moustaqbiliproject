<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Security policy: only this site's own scripts may run, so injected code is blocked. Add a host here before loading anything new from another site. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://open.er-api.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- Search engines should not list the "page not found" page -->
  <meta name="robots" content="noindex">
  <title>Page not found | moustaqbili</title>
  <!-- Site icon (browser tab, bookmarks, phone home screen): assets/img/favicon.svg -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind styles, built from tailwind.config.js (see README). Loaded last so it wins over styles.css, as before. -->
  <link rel="stylesheet" href="assets/css/tailwind.css">
</head>
<!-- Shown by the web host whenever someone opens a page that doesn't exist (a typo, an old link or bookmark).
     "page-home" hides the small header search, because this page has the big one. -->
<body class="page-home page-404 bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <div id="site-header"></div>

  <main class="flex-grow">

    <!-- What happened, and the search bar to find the page they wanted -->
    <section class="gov-hero-gradient text-white pt-12 pb-12 px-4 sm:px-6 lg:px-8 border-b border-slate-800">
      <div class="max-w-3xl mx-auto text-center">
        <span class="inline-block px-3 py-1 rounded bg-slate-800 border border-slate-700 text-slate-300 text-xs font-semibold mb-4" data-i18n="nf_badge">Error 404</span>
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight leading-tight mb-3" data-i18n="nf_title">We couldn't find this page</h1>
        <p class="text-sm sm:text-base text-slate-300 leading-relaxed" data-i18n="nf_desc">The link may be wrong, or the page has moved. Search for what you need, or pick a page below.</p>
        <form id="nf-search-form" action="index.html" method="get" role="search" class="mt-6 flex gap-2">
          <label for="nf-search-input" class="sr-only" data-i18n="site_search_label">Search the site</label>
          <input id="nf-search-input" name="q" type="search" autocomplete="off"
            placeholder="e.g. How much money do I get in the UK?" data-i18n-placeholder="home_q_placeholder"
            class="home-search-input">
          <button type="submit" class="home-search-btn" data-i18n="site_search_btn">Search</button>
        </form>
      </div>
    </section>

    <!-- The main pages, so nobody is stuck -->
    <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
      <div class="flex flex-wrap justify-center gap-3 mb-8">
        <a href="index.html" class="home-search-btn inline-flex items-center py-2" data-i18n="home_go_search">Go to the search</a>
        <a href="navigate.html" class="inline-flex items-center px-4 py-2 rounded-lg border border-slate-300 bg-white text-sm font-bold text-slate-800 hover:bg-slate-100" data-i18n="nav_navigate">More info</a>
      </div>
      <h2 id="nf-pages-title" class="text-sm font-bold text-slate-600 mb-3" data-i18n="nf_pages">Or go straight to a page</h2>
      <!-- Filled from SITE_PAGES in layout.js (init404Page in app.js), so it matches the side panel -->
      <nav id="nf-pages" class="flex flex-wrap justify-center gap-2" aria-labelledby="nf-pages-title"></nav>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
